      - reason: 'Use an owned structured-concurrency scope for ordinary asynchronous work.'
        value: 'java.util.concurrent.Executors.newFixedThreadPool'
      - reason: 'Use an owned structured-concurrency scope for ordinary asynchronous work.'
        value: 'java.util.concurrent.Executors.newSingleThreadExecutor'
      - reason: 'Use a lifecycle-owned scheduler and document its shutdown boundary.'
        value: 'java.util.concurrent.Executors.newSingleThreadScheduledExecutor'
      - reason: 'Use a lifecycle-owned scheduler and document its shutdown boundary.'
        value: 'java.util.concurrent.Executors.newScheduledThreadPool'
